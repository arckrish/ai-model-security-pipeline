# Example PipelineRun for RedHatAI/Qwen3-8B-FP8-dynamic — edit model-id / serving-yaml
# for other models, then:
#   oc create -f instances/tekton-pipeline/pipelinerun-example.yaml
#
# Prerequisites:
#   - model-fetch Job completed
#     (pushed quay.io/sudash/ai-model-security-pipeline:<model-id>-unverified)
#   - Quay pull secret in model-eval + model-sandbox + model-test
#   - oc apply -k instances/model-sandbox/ (namespace persists)
#   - Scanner + publish images built; rebuild publish after ModelCar changes
#   - git-url reachable from model-eval (HTTPS)
#   - modelcar-image must match Job MODELCAR_IMAGE (shared repo)
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: model-security-
  labels:
    app.kubernetes.io/part-of: ai-model-security-pipeline
spec:
  pipelineRef:
    name: model-security-pipeline
  taskRunTemplate:
    serviceAccountName: model-eval-pipeline
  params:
    - name: model-id
      value: redhatai-qwen3-8b-fp8-dynamic
    - name: modelcar-image
      value: quay.io/sudash/ai-model-security-pipeline
    - name: model-path
      value: /workspace/models
    - name: git-url
      value: https://github.com/sukantadash/ai-model-security-pipeline.git
    - name: git-revision
      value: cluster-install
    - name: model-sandbox-path
      value: instances/model-sandbox/LLMInferenceService.yaml
    - name: serving-yaml
      value: instances/model-test/qwen3-8b-fp8-verified.yaml
  workspaces:
    - name: shared-data
      persistentVolumeClaim:
        claimName: eval-workspace
    - name: results
      emptyDir: {}
